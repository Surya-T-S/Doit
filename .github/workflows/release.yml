name: Release Multi-Platform Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: npm run release:win
            artifact_dir: release
            artifact_files: release/*.exe
          - os: macos-latest
            platform: macos
            build_cmd: npm run release:mac
            artifact_dir: release
            artifact_files: release/*.dmg
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run release:linux
            artifact_dir: release
            artifact_files: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package for ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.build_cmd }}

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doit-${{ matrix.platform }}-release
          path: ${{ matrix.artifact_files }}
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/**/*
          generate_release_notes: true
