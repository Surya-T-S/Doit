name: Release Multi-Platform Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: release/windows/*
          - os: macos-latest
            platform: macos
            artifact: release/macos/*
          - os: ubuntu-latest
            platform: linux
            artifact: release/linux/*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build and release pipeline
        run: npm run release

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doit-${{ matrix.platform }}-release
          path: |
            release/${{ matrix.platform }}/*
            release/release-manifest.json

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            doit-windows-release/*
            doit-macos-release/*
            doit-linux-release/*
          generate_release_notes: true
