name: Bug Report
description: Create a report to help us improve Doit
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the details below.
  - type: input
    id: os
    attributes:
      label: Operating System & Version
      placeholder: e.g. Windows 11, macOS 14 Sonoma, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Doit App Version
      placeholder: e.g. 1.0.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true

