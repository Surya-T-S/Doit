name: Feature Request
description: Suggest an idea or enhancement for Doit
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for proposing an improvement! Remember: Doit prioritizes simplicity, distraction-free design, and offline execution."
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: A clear and concise description of what the pain point is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Describe any alternative solutions or features you've considered.

